<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head lang="en">
<!--/*/ <th:block th:include="fragments/headerinc :: head"></th:block> /*/-->
</head>
<body>
<div class='dashboard'>
    <div class="dashboard-nav">
        <!--/*/ <th:block th:include="fragments/util :: menu"></th:block> /*/-->
    </div>
    <div class='dashboard-app'>
        <header class='dashboard-toolbar'>
        <!--/*/ <th:block th:include="fragments/util :: cabecera2022"></th:block> /*/-->
        </header>
        <div class='dashboard-content' style="overflow-y: scroll;">
            <div class='container'>
                <div class='card'>

                    <div id="container">
                        <div id="actionbar" class="row">
                            <div class="col-md-3 mb-3">
                                <a href="#" th:href="@{/facturas/regresar}"><img th:src="@{/images/iconos/regresar.png}" alt="Regresar" /></a>
                            </div>
                            <div class="col-md-6 mb-3 tituloPrincipal" align="center"><br/> SUNAT - Factura Alquiler y Servicios - Descargar PDF</div>
                            <div class="col-md-3 mb-3"></div>
                        </div>

                        <form id="form" th:object="${filtro}" th:action="@{/facturas/ose/descarga/pdf/q}" method="post">
                            <div id="informacion" class="container_v3">
                                <br/>

                                <fieldset class="scheduler-border fondoFactura">
                                    <legend class="scheduler-border title10pt"><b>Datos de la Descarga</b></legend>
                                    <div class="row"><div class="col-md-12 mb-0">&nbsp;</div></div>

                                    <!-- Ruta de descarga -->
                                    <div class="row">
                                        <div class="col-md-12 mb-0">
                                            <label for="idRutaDescarga" class="title10pt">Ruta de Descarga: </label>
                                            <input type="text" id="idRutaDescarga" class="form-control_v2 is-valid"
                                                   th:field="${filtro.rutaDescarga}"
                                                   placeholder="Ejemplo: C:/factura/Septiembre-2026"
                                                   autocomplete="off"  />
                                            <small class="text-muted">Carpeta donde se guardar&aacute;n los archivos PDF.</small>
                                        </div>
                                    </div>
                                    <br/>

                                    <!-- A&ntilde;o y Mes -->
                                    <div class="row">
                                        <div class="col-md-4 mb-0">
                                            <label for="idAnio" class="title10pt">A&ntilde;o: </label>
                                            <select th:field="${filtro.anio}" 
												class="form-control_v2 is-valid">
													<option value="-1">--Todos--</option>
													<option th:each="entry : ${session.SessionMapAnioFactura}" th:value="${entry.value}"
														th:text="${entry.key}">opcion</option>
											</select>
                                        </div>
                                        <div class="col-md-4 mb-0">
                                            <label for="idMes" class="title10pt">Mes: </label>
                                            <select th:field="${filtro.mesFiltro}" 
												class="form-control_v2 is-valid">
													<option value="-1">--Todos--</option>
													<option th:each="entry : ${session.SessionMapMeses}" th:value="${entry.value}"
														th:text="${entry.key}">opcion</option>
											</select>
                                        </div>
                                        <div class="col-md-4 mb-0"></div>
                                    </div>
                                    <br/>
                                </fieldset>
                                <br/>

                                <!-- Mensaje de resultado -->
                                <div class="row">
                                    <div class="col-md-3 mb-3"></div>
                                    <div class="col-md-6 mb-3" align="center">
                                        <div class="alert alert-danger" th:if="${respuesta}" th:utext="${respuesta}"></div>
                                        <div class="alert alert-success" th:if="${mensajeOk}" th:utext="${mensajeOk}"></div>
                                    </div>
                                    <div class="col-md-3 mb-3"></div>
                                </div>

                                <!-- Botones -->
                                <div class="container_v4" align="center">
                                    <div class="row">
                                        <div class="col-md-3 mb-3"></div>
                                        <div class="col-md-6 mb-3">
                                            <button class="btn btn-success" type="submit"
                                                    onclick="jsDeshabilitaBoton(this);">Descargar</button>
                                        </div>
                                        <div class="col-md-3 mb-3"></div>
                                    </div>
                                    <div class="row"><div class="col-md-12 mb-3"><br></br></div></div>
                                </div>

                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
